<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Sintaks CSS</title>

  <style>
    /* Ini adalah komentar CSS -- tidak memengaruhi tampilan */
    p {
      color: #333333;
      font-size: 18px;
    }

    h1 {
      color: #003f72;
      /* baris di bawah sengaja dikomentari, coba aktifkan sendiri */
      /* text-align: center; */
    }
  </style>
</head>

<body>
  <h1>Judul Halaman</h1>

  <p>Paragraf pertama, warnanya diatur melalui selector p.</p>

  <p>
    Paragraf kedua, ikut berubah karena selector yang sama
    menargetkan semua elemen p pada halaman.
  </p>
</body>
</html>
